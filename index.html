  return j}

function _snapDoc(c,id){const d=S.cache[c]&&S.cache[c].get(id);return{id,exists:!!d,data:()=>d,metadata:{fromCache:false,hasPendingWrites:false}}}
function _fire(s){try{if(s.kind==='doc'){s.next(_snapDoc(s.c,s.id));return}
  let docs=[..._map(s.c).entries()].map(([id,d])=>({id,exists:true,data:()=>d,metadata:{fromCache:false}}));
  if(s.o){const f=s.o,dir=s.dir==='desc'?-1:1;docs.sort((a,b)=>{const x=a.data()[f],y=b.data()[f];if(x===y)return 0;if(x===undefined)return 1;if(y===undefined)return -1;return(x<y?-1:1)*dir})}
  if(s.l)docs=docs.slice(0,s.l);s.next({docs,size:docs.length,empty:!docs.length,docChanges:()=>[],metadata:{fromCache:false,hasPendingWrites:false}})}catch(e){console.error(e)}}

  get:async()=>_snapDoc(c,id),
  set:async d=>{const r=await gs('call',S.token,'set',c,id,_clone(d));_map(c).set(id,r.data||_clone(d));_emit(c)},
  update:async d=>{const r=await gs('call',S.token,'update',c,id,_clone(d));_map(c).set(id,r.data||_deep(_map(c).get(id),d));_emit(c)},

async function shrink(file){
  try{const bmp=await createImageBitmap(file);const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.8))}catch(e){return file}
}

let fxEdit=null, fxPay=null, fxFile=null;
const fxDocItems=mk=>{const d=jual['tetap-'+mk];return d?fxList(d):[]};
function fxOverdue(){const now=new Date();const mk=ymd(now).slice(0,7);const it=jual['tetap-'+mk]?fxList(jual['tetap-'+mk]):[];return it.filter(x=>!x.paid&&+x.due&&now.getDate()>+x.due&&+x.amount).length}
const fixedCashOn=d=>{const it=fxDocItems(d.slice(0,7));return it.filter(x=>x.paid&&x.paid.date===d&&x.paid.method==='laci').reduce((s,x)=>s+(+x.amount||0),0)};
function fxClean(){return fxEdit.items.filter(x=>x.label.trim()&&String(x.amount).trim()!=='').map(x=>{const o={label:x.label.trim(),amount:+(+String(x.amount).replace(',','.')||0).toFixed(2)};const d=parseInt(x.due);if(d>=1&&d<=31)o.due=d;if(x.paid)o.paid=x.paid;return o})}
function fxList(fx){if(Array.isArray(fx.items))return fx.items;const out=[];[['sewa','Sewa kedai'],['utiliti','Elektrik, air, internet'],['lain','Lain-lain']].forEach(([k,l])=>{if(fx[k]!=null&&fx[k]!=='')out.push({label:l,amount:+fx[k]})});return out.length?out:[{label:'Sewa kedai',amount:''},{label:'Elektrik',amount:''},{label:'Air',amount:''},{label:'Internet',amount:''},{label:'Langganan FeedMe',amount:''}]}
const priceOf=l=>{if(+l.price)return +l.price;const c=catalog.find(i=>i.id===l.id)||catalog.find(i=>i.name===l.name);return +c?.price||0};
const salesOf=j=>!j?0:(j.total!==undefined?+j.total||0:(+j.tunai||0)+(+j.qr||0)+(+j.kad||0)+(+j.delivery||0));
const cashOut=d=>resits.filter(r=>r.date===d&&(r.pay||'laci')==='laci').reduce((s,r)=>s+(+r.total||0),0)+gajiCashOn(d)+poCashOn(d)+supPayCashOn(d)+fixedCashOn(d);
const floatAmt=()=>+(jual['config-float']?.amount)||0;
function cashCalc(d){const j=jual[d]||{};const fl=j.float!==undefined?+j.float:floatAmt();const has=j.counted!==undefined&&j.counted!=='';const inHand=has?(+j.counted)-fl:null;const hasT=j.tunai!==undefined&&j.tunai!=='';const expect=hasT?(+j.tunai)-cashOut(d):null;const diff=has&&hasT?inHand-expect:null;return{fl,has,hasT,inHand,expect,diff}}
function labourOn(d){let t=0;const W=weeks['w-'+mondayOf(new Date(d+'T00:00:00'))];if(!W)return 0;workers.forEach(w=>{t+=(+(W.att[w.id]||{})[d]||0)*(+((W.rates||{})[w.id]??w.rate)||0)});return t}
const paidObj=p=>!p?null:typeof p==='string'?{at:p,date:p.slice(0,10),method:'laci'}:p;
function gajiCashOn(d){let t=0;Object.values(weeks).forEach(W=>Object.values(W.paid||{}).forEach(p=>{p=paidObj(p);if(p&&p.date===d&&p.method==='laci')t+=+p.amount||0}));return t}
function adjInMonth(mk){let t=0;Object.values(weeks).forEach(W=>{if((W.week||'').slice(0,7)!==mk)return;Object.values(W.adj||{}).forEach(a=>t+=(+a.plus||0)-(+a.minus||0))});return t}
const poEst=p=>p.lines.reduce((x,l)=>x+(+l.qty||0)*priceOf(l),0);
let bayarck=[], ckWeek=null, ckSel={}, delPay=null;
function paidOf(id){for(const b of bayarck)if((b.poIds||[]).includes(id))return b;return null}
function shareOf(p){const b=paidOf(p._id);if(!b)return null;const ps=(b.poIds||[]).map(x=>pos.find(q=>q._id===x)).filter(Boolean);const tot=ps.reduce((s,q)=>s+poEst(q),0);if(!ps.length)return null;return tot>0?(+b.amount)*poEst(p)/tot:(+b.amount)/ps.length}

const ckOn=d=>pos.filter(p=>(p.forDate||p.date)===d).reduce((s,p)=>s+poCost(p),0);

function vSum(){

  const pmk=ymd(new Date(now.getFullYear(),now.getMonth()-1,1)).slice(0,7);const fxOwn=jual['tetap-'+mk];const fx=fxOwn||jual['tetap-'+pmk]||{};const fxCarry=!fxOwn&&!!jual['tetap-'+pmk];const fxItems=fxList(fx);const fixed=fxItems.reduce((s,x)=>s+(+x.amount||0),0);if(!fxEdit||fxEdit.mk!==mk)fxEdit={mk,items:fxItems.map(x=>{const y={...x,id:uid()};if(fxCarry)delete y.paid;return y})};

/* ---------- gaji ---------- */
function wkDoc(){return weeks['w-'+gWeek]||(weeks['w-'+gWeek]={week:gWeek,att:{},adj:{},paid:{}})}
function calc(w,W){const att=W.att[w.id]||{};const days=Object.values(att).reduce((s,v)=>s+(+v||0),0);const a=W.adj[w.id]||{};const plus=+a.plus||0,minus=+a.minus||0;const rate=+((W.rates||{})[w.id]??w.rate)||0;return{days,rate,plus,minus,base:days*rate,total:days*rate+plus-minus,note:a.note||''}}
function slip(w,W){const c=calc(w,W);return `*Slip Gaji — Nasi Lemak DoReMi*\nNama: ${w.name}\nMinggu: ${dmy(W.week)} – ${dmy(addDays(W.week,6))}\n\nHari kerja: ${c.days} × ${rm(c.rate)} = ${rm(c.base)}${c.plus?`\nTambahan: ${rm(c.plus)}`:''}${c.minus?`\nPotongan: ${rm(c.minus)}`:''}${c.note?`\nNota: ${c.note}`:''}\n\n*Jumlah: ${rm(c.total)}*`}

  else{h+=`<div class="panel tbl"><table class="gt"><thead><tr><th>Pekerja</th>${dates.map((d,i)=>`<th class="d">${HARI[i]}<br><span class="num" style="font-weight:400">${d.slice(8)}</span></th>`).join('')}<th class="r">Hari</th><th>Tambahan</th><th>Potongan</th><th class="r">Jumlah</th><th></th></tr></thead><tbody>`;
  act.forEach(w=>{const c=calc(w,W);grand+=c.total;const att=W.att[w.id]||{};const paid=paidObj(W.paid[w.id]);
    h+=`<tr><td><b>${esc(w.name)}</b><br><span class="num" style="color:var(--muted);font-size:12px">${rm(c.rate)}/hari${c.rate!==(+w.rate||0)?' (kadar minggu ini)':''}</span></td>${dates.map(d=>{const v=+att[d]||0;return `<td class="d"><button class="cell ${v===1?'f':v===.5?'h':''}" data-a="cell" data-w="${w.id}" data-d="${d}" aria-label="${esc(w.name)} ${dmy(d)}">${v===1?'✓':v===.5?'½':''}</button></td>`}).join('')}
    <td class="r num" id="dy-${w.id}">${c.days}</td>
    <td><input id="pl-${w.id}" data-g="plus" data-w="${w.id}" inputmode="decimal" value="${c.plus||''}" placeholder="0"></td>
    <td><input id="mi-${w.id}" data-g="minus" data-w="${w.id}" inputmode="decimal" value="${c.minus||''}" placeholder="0"></td>
    <td class="r num" id="tt-${w.id}"><b>${rm(c.total)}</b></td>
    <td><div style="display:flex;gap:6px"><button class="btn sm" data-a="slip" data-w="${w.id}">Slip</button>${paid?`<button class="btn sm" data-a="unpay" data-w="${w.id}" title="Batal tanda bayar"><span class="pill sent">Dibayar ${dmy(paid.date).slice(0,5)} · ${esc(GPAY[paid.method]||'')}</span></button>`:payFor===w.id?Object.entries(GPAY).map(([k,v])=>`<button class="btn sm pri" data-a="payM" data-m="${k}" data-w="${w.id}">${v}</button>`).join('')+`<button class="btn sm" data-a="payX">Batal</button>`:`<button class="btn sm pri" data-a="pay" data-w="${w.id}">Bayar</button>`}</div></td></tr>
    <tr><td colspan="13" style="padding-top:0"><input id="nt-${w.id}" data-g="note" data-w="${w.id}" value="${esc(c.note)}" placeholder="Nota (cth: advance RM50 Selasa, OT Sabtu)" style="width:100%;font-size:13px"></td></tr>`});

function refreshRow(wid){const w=workers.find(x=>x.id===wid);if(!w)return;const W=wkDoc();const c=calc(w,W);const t=document.getElementById('tt-'+wid);if(t)t.innerHTML='<b>'+rm(c.total)+'</b>';const g=$('#grand');if(g)g.textContent=rm(workers.filter(x=>x.active!==false||Object.keys(W.att[x.id]||{}).length).reduce((s,x)=>s+calc(x,W).total,0))}
function saveWeek(now){const id='w-'+gWeek;dirtyWeek=id;clearTimeout(saveT);saveT=setTimeout(async()=>{const data=JSON.parse(JSON.stringify(weeks[id]));const ch=pendingLog;pendingLog=[];try{await db.doc('gaji/'+id).set(data);if(ch.length)logIt('Gaji minggu '+dmy(id.slice(2)).slice(0,5),ch.join('; '))}catch(err){toast('Gagal simpan gaji: '+err.message)}finally{if(dirtyWeek===id)dirtyWeek=null}},now?50:1500)}
